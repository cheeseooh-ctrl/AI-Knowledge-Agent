name: 🪐 Daily AI Knowledge Briefing & Push

on:
  schedule:
    # 每天 UTC 00:30 (即北京时间每天早晨 08:30) 全自动免开机触发
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持在 GitHub 网页端随时点击【Run workflow】手动测试运行

permissions:
  contents: write # 允许自动写入 reports/ 与 data/memory/ 并提交回仓库

jobs:
  run-pipeline:
    name: Run Multi-Agent Pipeline & Feishu Push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 Run AI Knowledge Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          # 核心流水线：全网多源采集 -> 记忆加权与防炒冷饭 -> 深度穿透研读 -> 主笔与恶魔质检对抗 -> 飞书卡片推送
          python3 run.py --feishu

      - name: 💾 Commit & Push Reports and Memory Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/memory/
          git commit -m "chore(daily): 云端自动归档今日AI情报与更新记忆库 [skip ci]" || echo "今日无新增变动需要提交"
          git push origin main
